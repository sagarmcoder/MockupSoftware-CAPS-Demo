<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla Time Entry Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Vanilla JavaScript Time Entries</h1>

        <thead><tr><th>Employee</th><th>Work date</th><th>Hours</th></tr></thead>
        <tbody id="time-entry-body"></tbody>
      </table>
    </main>
    <script src="app.js"></script>
  </body>
</html>
